name: Login Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: login-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip
          python -m pip install requests pycryptodome

      - name: Run safe login probe
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          ICOURSE_SESSION_COOKIE: ${{ secrets.ICOURSE_SESSION_COOKIE }}
        run: python -u scripts/login_probe.py
