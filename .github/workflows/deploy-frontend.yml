name: Deploy Frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**']
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy frontend from (e.g. main, dev)"
        required: true
        default: "main"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # On manual dispatch we honour the ``branch`` input; for the auto
      # push trigger this resolves to '' and actions/checkout falls back
      # to the triggering ref (i.e. main per the push filter above).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # GitHub Pages serves JavaScript with max-age=600.  Versioning the
      # local script URLs prevents an old cached app.js from surviving a
      # deployment and showing stale UI logic.  Bump frontend/VERSION using
      # semantic versions whenever frontend behavior changes.
      - name: Version local scripts
        run: |
          VERSION=$(tr -d '[:space:]' < frontend/VERSION)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::frontend/VERSION must use x.y.z semantic versioning."
            exit 1
          fi
          sed -i "s/?v=dev/?v=${VERSION}/g" frontend/index.html
          if grep -q '?v=dev' frontend/index.html; then
            echo "::error::Unversioned local script URL remains."
            exit 1
          fi
          grep -q "js/app.js?v=${VERSION}" frontend/index.html
          echo "Frontend version: ${VERSION}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
