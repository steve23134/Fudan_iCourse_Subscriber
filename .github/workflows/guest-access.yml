name: Configure Guest Access

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guest-access-config
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crypto dependency
        run: pip install pycryptodome

      - name: Generate encrypted guest access
        env:
          GUEST_USERNAME: ${{ secrets.GUEST_USERNAME }}
          GUEST_PASSWORD: ${{ secrets.GUEST_PASSWORD }}
          GUEST_ROUTE_SLUG: ${{ secrets.GUEST_ROUTE_SLUG }}
          GUEST_PAT: ${{ secrets.GUEST_PAT }}
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
          DATA_BRANCH: data
        run: python scripts/generate_guest_access.py

      - name: Commit guest configuration
        env:
          GUEST_PAT: ${{ secrets.GUEST_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/access/guest-access.enc frontend/js/guest-config.js
          if git diff --cached --quiet; then
            echo "Guest configuration unchanged."
            exit 0
          fi
          git commit -m "chore: update encrypted guest access"
          git remote set-url origin \
            "https://x-access-token:${GUEST_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
